name: Daily YouTube RSS Digest

on:
  schedule:
    # 10:00 Asia/Shanghai / Taipei is 02:00 UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Reprocess the selected latest or report-date item even if it already exists"
        required: false
        default: false
        type: boolean
      report_date:
        description: "Ended local date to rebuild (YYYY-MM-DD); leave empty for latest videos"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS, youtube-rss]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Preflight local runner
        run: |
          # Put Homebrew + Deno on PATH for all later steps (yt-dlp needs a JS runtime).
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          ffmpeg -version | head -1 || /opt/homebrew/bin/ffmpeg -version | head -1
          gtar --version | head -1
          test -w "$GITHUB_WORKSPACE"
          # Deno is required by modern yt-dlp; install on demand if missing.
          /opt/homebrew/bin/deno --version >/dev/null 2>&1 || /opt/homebrew/bin/brew install deno
          /opt/homebrew/bin/deno --version | head -1

      - name: Install Python dependencies
        run: |
          # curl_cffi (yt-dlp --impersonate) needs a non-anaconda Python: anaconda's
          # OpenSSL clashes with curl_cffi's BoringSSL ("invalid library"). Pick the
          # newest clean interpreter available, falling back to the system one.
          PYTHON_BIN=""
          for cand in /opt/homebrew/bin/python3.13 /opt/homebrew/bin/python3.12 \
                      /opt/homebrew/bin/python3.11 /usr/bin/python3; do
            if [ -x "$cand" ]; then PYTHON_BIN="$cand"; break; fi
          done
          echo "Using PYTHON_BIN=$PYTHON_BIN ($($PYTHON_BIN --version 2>&1))"
          rm -rf .venv-ci
          "$PYTHON_BIN" -m venv .venv-ci
          .venv-ci/bin/python -m pip install --upgrade pip
          .venv-ci/bin/python -m pip install -r requirements.txt
          .venv-ci/bin/python -c "import curl_cffi, yt_dlp; print('curl_cffi', curl_cffi.__version__, '| yt-dlp', yt_dlp.version.__version__)"

      - name: Preflight YouTube RSS feeds
        run: .venv-ci/bin/python scripts/preflight_youtube_feeds.py --allow-transient-outage

      - name: Run tests
        run: .venv-ci/bin/python -m unittest discover -s tests

      - name: Generate feed
        env:
          HKUST_GZ_API_KEY: ${{ secrets.HKUST_GZ_API_KEY }}
          HKUST_GZ_BASE_URL: ${{ vars.HKUST_GZ_BASE_URL }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          ASR_MODEL: ${{ vars.ASR_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_FORCE: ${{ inputs.force }}
          WORKFLOW_REPORT_DATE: ${{ inputs.report_date }}
        run: |
          args=()
          if [ "$WORKFLOW_EVENT_NAME" = "workflow_dispatch" ] && [ "$WORKFLOW_FORCE" = "true" ]; then
            args+=(--force)
          fi
          if [ "$WORKFLOW_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$WORKFLOW_REPORT_DATE" ]; then
            args+=(--report-date "$WORKFLOW_REPORT_DATE")
          fi
          .venv-ci/bin/python scripts/main.py "${args[@]}"

      - name: Commit generated state and feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json summaries.json public
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update daily YouTube RSS digest"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
