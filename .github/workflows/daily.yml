name: Daily YouTube RSS Digest

on:
  schedule:
    # 10:00 Asia/Shanghai / Taipei is 02:00 UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Reprocess latest videos even if the daily item already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS, youtube-rss]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Preflight local runner
        run: |
          python --version
          ffmpeg -version
          test -w "$GITHUB_WORKSPACE"
          curl -fsSL --max-time 20 "https://www.youtube.com/feeds/videos.xml?channel_id=UCFQsi7WaF5X41tcuOryDk8w" >/dev/null

      - name: Install Python dependencies
        run: |
          rm -rf .venv-ci
          python -m venv .venv-ci
          .venv-ci/bin/python -m pip install --upgrade pip
          .venv-ci/bin/python -m pip install -r requirements.txt

      - name: Run tests
        run: .venv-ci/bin/python -m unittest discover -s tests

      - name: Generate feed
        env:
          HKUST_GZ_API_KEY: ${{ secrets.HKUST_GZ_API_KEY }}
          HKUST_GZ_BASE_URL: ${{ vars.HKUST_GZ_BASE_URL }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          ASR_MODEL: ${{ vars.ASR_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            .venv-ci/bin/python scripts/main.py --force
          else
            .venv-ci/bin/python scripts/main.py
          fi

      - name: Commit generated state and feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json summaries.json public
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update daily YouTube RSS digest"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
