name: Daily YouTube RSS Digest

on:
  schedule:
    # 10:00 Asia/Shanghai / Taipei is 02:00 UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Generate feed
        env:
          HKUST_GZ_API_KEY: ${{ secrets.HKUST_GZ_API_KEY }}
          HKUST_GZ_BASE_URL: ${{ vars.HKUST_GZ_BASE_URL }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          ASR_MODEL: ${{ vars.ASR_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/main.py

      - name: Commit generated state and feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json summaries.json public
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update daily YouTube RSS digest"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
