name: Daily YouTube RSS Digest

on:
  schedule:
    # 12:00 Asia/Shanghai / Taipei is 04:00 UTC.
    - cron: "0 4 * * *"
  push:
    branches:
      - master
    paths:
      - ".github/backfill-request"
      - ".github/backfill-request-sequence"
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Deploy existing committed public output only; skip source, summary, and private guidance generation"
        required: false
        default: false
        type: boolean
      force:
        description: "Reprocess the selected latest or report-date item even if it already exists"
        required: false
        default: false
        type: boolean
      report_date:
        description: "Ended local date to rebuild (YYYY-MM-DD); leave empty for latest videos"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS, youtube-rss-xiemac]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Preflight local runner
        run: |
          # Set PATH now as well as for later steps; Intel and ARM use different prefixes.
          export PATH="/usr/local/bin:/opt/homebrew/bin:$HOME/.deno/bin:$PATH"
          BREW_PREFIX="$(brew --prefix)"
          export PATH="$BREW_PREFIX/bin:$PATH"
          printf '%s\n' "$BREW_PREFIX/bin" /usr/local/bin /opt/homebrew/bin "$HOME/.deno/bin" >> "$GITHUB_PATH"
          for tool in ffmpeg gtar deno; do
            command -v "$tool" >/dev/null || { echo "::error::Missing required tool: $tool"; exit 1; }
          done
          ffmpeg -version
          gtar --version
          deno --version
          test -w "$GITHUB_WORKSPACE"

      - name: Install Python dependencies
        run: |
          # curl_cffi (yt-dlp --impersonate) needs a non-anaconda Python: anaconda's
          # OpenSSL clashes with curl_cffi's BoringSSL ("invalid library"). Pick the
          # installed Homebrew interpreter >=3.11; macOS system Python is too old.
          PYTHON_BIN=""
          for cand in /usr/local/bin/python3.13 /usr/local/bin/python3.12 \
                      /usr/local/bin/python3.11 /usr/local/bin/python3 \
                      /opt/homebrew/bin/python3.13 /opt/homebrew/bin/python3.12 \
                      /opt/homebrew/bin/python3.11 /opt/homebrew/bin/python3; do
            if [ -x "$cand" ] && "$cand" -c 'import sys; raise SystemExit(sys.version_info < (3, 11))'; then
              PYTHON_BIN="$cand"
              break
            fi
          done
          if [ -z "$PYTHON_BIN" ]; then
            echo "::error::Homebrew Python >=3.11 is required; install it before running this workflow."
            exit 1
          fi
          echo "Using PYTHON_BIN=$PYTHON_BIN ($("$PYTHON_BIN" --version 2>&1))"
          rm -rf .venv-ci
          "$PYTHON_BIN" -m venv .venv-ci
          .venv-ci/bin/python -m pip install --upgrade pip
          .venv-ci/bin/python -m pip install -r requirements.txt
          .venv-ci/bin/python -c "import curl_cffi, yt_dlp; print('curl_cffi', curl_cffi.__version__, '| yt-dlp', yt_dlp.version.__version__)"

      - name: Preflight YouTube RSS feeds
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_only }}
        run: .venv-ci/bin/python scripts/preflight_youtube_feeds.py --allow-transient-outage

      - name: Run tests
        run: .venv-ci/bin/python -m unittest discover -s tests

      - name: Generate feed
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_only }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          HKUST_GZ_API_KEY: ${{ secrets.HKUST_GZ_API_KEY }}
          HKUST_GZ_BASE_URL: ${{ vars.HKUST_GZ_BASE_URL }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          ASR_MODEL: ${{ vars.ASR_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_FORCE: ${{ inputs.force }}
          WORKFLOW_REPORT_DATE: ${{ inputs.report_date }}
          BACKFILL_REQUEST_PATH: .github/backfill-request
          BACKFILL_REQUEST_SEQUENCE_PATH: .github/backfill-request-sequence
        run: |
          args=()
          if [ "$WORKFLOW_EVENT_NAME" = "workflow_dispatch" ] && [ "$WORKFLOW_FORCE" = "true" ]; then
            args+=(--force)
          fi
          if [ "$WORKFLOW_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$WORKFLOW_REPORT_DATE" ]; then
            args+=(--report-date "$WORKFLOW_REPORT_DATE")
          fi
          if [ "$WORKFLOW_EVENT_NAME" = "push" ]; then
            requested_sequence="$(
              .venv-ci/bin/python scripts/validate_backfill_request_sequence.py "$BACKFILL_REQUEST_SEQUENCE_PATH"
            )"
            requested_report_date="$(
              .venv-ci/bin/python scripts/validate_backfill_request.py "$BACKFILL_REQUEST_PATH"
            )"
            args+=(--report-date "$requested_report_date")
          fi
          .venv-ci/bin/python scripts/main.py "${args[@]}"

      - name: Commit generated state and feed
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json summaries.json public
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update daily YouTube RSS digest"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Generate private portfolio guidance (opt-in)
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.publish_only) && vars.PORTFOLIO_GUIDANCE_ENABLED == 'true' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
        run: .venv-ci/bin/python scripts/portfolio_guidance.py
