<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --fg: #111827;
      --muted: #64748b;
      --line: #dbe3ee;
      --accent: #0f766e;
      --panel: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --fg: #e5e7eb;
        --muted: #9ca3af;
        --line: #263244;
        --accent: #5eead4;
        --panel: #111827;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }
    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }
    header, article, footer {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
    }
    header { margin-bottom: 16px; }
    article { overflow-wrap: anywhere; }
    footer { margin-top: 16px; color: var(--muted); }
    h1, h2, h3 { line-height: 1.25; }
    h1 { margin: 0 0 12px; font-size: clamp(1.65rem, 4vw, 2.35rem); }
    h2 { margin-top: 0; }
    h3 { margin-top: 1.4em; }
    p { margin: 0.65em 0; }
    ul { padding-left: 1.25em; }
    a { color: var(--accent); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.86rem;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      padding: 4px 10px;
      font-size: 0.9rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    .button {
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: var(--accent);
      display: inline-block;
      padding: 7px 11px;
      text-decoration: none;
    }
    section {
      border-top: 1px solid var(--line);
      margin-top: 18px;
      padding-top: 12px;
    }
    small { color: var(--muted); font-weight: 500; }
    </style>
</head>
