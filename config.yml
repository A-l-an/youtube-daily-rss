timezone: Asia/Shanghai
schedule_time: "10:00"

channels:
  - name: "视野环球财经"
    channel_id: "UCFQsi7WaF5X41tcuOryDk8w"
    handle: "@RhinoFinance"
  - name: "NaNa说美股"
    channel_id: "UCFhJ8ZFg9W4kLwFTBBNIjOw"
    handle: "@NaNaShuoMeiGu"

# How yt-dlp gets past YouTube's bot gate. All values are overridable by env vars
# (YTDLP_COOKIES, YT_IMPERSONATE, YTDLP_AUDIO_CLIENTS, YTDLP_SUBTITLE_CLIENTS,
# YTDLP_POT_BASE_URL); env always wins. See docs/INCIDENT-2026-06-16-*.md.
youtube_access:
  # Netscape cookies.txt exported from a logged-in YouTube session.
  # Keep this file OUT of git. Refresh it when channels start going link-only again.
  cookies_file: "~/.config/youtube-daily-rss/youtube-cookies.txt"
  # curl_cffi browser-TLS target; set to "none" to disable impersonation.
  impersonate: "chrome-131"
  # Optional player-client overrides (leave commented to keep code defaults):
  # audio_player_clients: ["android", "mweb", "web"]
  # subtitle_player_clients: ["android", "mweb", "web"]
  # Optional bgutil PO-token provider (HTTP mode) for SABR-gated audio:
  # pot_base_url: "http://127.0.0.1:4416"

transcript:
  preferred_languages: ["zh-Hans", "zh", "zh-CN", "en"]
  allow_auto_captions: true
  yt_dlp_fallback:
    enabled: true
    subtitle_format: "vtt"
    sleep_interval_seconds: 2

asr:
  enabled: true
  provider: "hkust_gz"
  model: "whisper-1"
  language_candidates: ["zh", "en"]
  chunk_seconds: 300
  download_attempts: 3
  download_sleep_seconds: 5
  allow_youtube_audio_download: true

summary:
  provider: "hkust_gz"
  language: "zh-CN"
  model: "DeepSeek-V4-Pro"
  fallback_models: ["gpt-3.5-turbo", "gpt-4o-mini", "gpt-4o"]
  max_key_points: 8
  include_financial_disclaimer: true

rss:
  title: "Daily YouTube Finance Digest"
  description: "Daily merged summaries of 视野环球财经 and NaNa说美股"
  link: "https://a-l-an.github.io/youtube-daily-rss/feed.xml"
  output_path: "public/feed.xml"
